<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d0f">
<title>Estante 9 · Estoque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;800&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0d0f;
    --surface:#15171b;
    --line:rgba(255,255,255,.07);
    --text:#f2efec;
    --muted:#767c85;
    --brasa:#e87722;
    --verde:#00d68f;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));
  }

  /* warm glow behind the readout — the only ambient effect on the page */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(58% 42% at 50% 38%, rgba(232,119,34,.10), transparent 70%);
    pointer-events:none;
  }

  .sheet{
    position:relative;
    width:100%;
    max-width:420px;
  }

  /* --- localização: a tag identifica um lugar, não só um produto --- */
  .local{
    font-family:var(--mono);
    font-size:11px;
    font-weight:500;
    letter-spacing:.2em;
    color:var(--muted);
    text-align:center;
    margin-bottom:18px;
  }
  .local span{color:var(--brasa)}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:32px;
    padding:34px 26px 28px;
    text-align:center;
  }

  .produto{
    font-size:19px;
    font-weight:600;
    line-height:1.3;
    letter-spacing:-.01em;
  }

  .fabricante{
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
  }

  /* --- o número --- */
  .leitura{
    margin:30px 0 4px;
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:12px;
  }

  .numero{
    font-family:var(--mono);
    font-weight:800;
    font-size:clamp(86px,28vw,124px);
    line-height:.86;
    letter-spacing:-.05em;
    font-variant-numeric:tabular-nums;
    transition:color .3s ease;
  }

  .unidade{
    font-size:19px;
    font-weight:500;
    color:var(--brasa);
    letter-spacing:-.01em;
  }

  .equivalencia{
    font-family:var(--mono);
    font-size:13px;
    color:var(--muted);
    letter-spacing:.02em;
  }

  .alerta{
    display:none;
    font-family:var(--mono);
    font-size:11px;
    font-weight:500;
    letter-spacing:.12em;
    color:var(--brasa);
    margin-top:14px;
  }
  .card.baixo .numero{color:var(--brasa)}
  .card.baixo .alerta{display:block}

  /* --- sincronização --- */
  .sync{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:28px;
    padding-top:20px;
    border-top:1px solid var(--line);
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--muted);
    letter-spacing:.04em;
  }

  .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--verde);
    box-shadow:0 0 0 0 rgba(0,214,143,.5);
    animation:pulso 2.6s ease-out infinite;
  }
  @keyframes pulso{
    0%{box-shadow:0 0 0 0 rgba(0,214,143,.45)}
    70%{box-shadow:0 0 0 7px rgba(0,214,143,0)}
    100%{box-shadow:0 0 0 0 rgba(0,214,143,0)}
  }

  /* --- alternador: só para você comparar os estados na maquete --- */
  .demo{
    margin-top:26px;
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .demo button{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.1em;
    color:var(--muted);
    background:transparent;
    border:1px solid var(--line);
    border-radius:100px;
    padding:8px 14px;
    cursor:pointer;
    transition:color .2s,border-color .2s;
  }
  .demo button:hover,.demo button:focus-visible{color:var(--text);border-color:rgba(255,255,255,.2)}
  .demo button[aria-pressed="true"]{color:var(--brasa);border-color:rgba(232,119,34,.45)}
  :focus-visible{outline:2px solid var(--brasa);outline-offset:3px}

  .rodape{
    text-align:center;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.14em;
    color:#4a5058;
    margin-top:14px;
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<main class="sheet">
  <p class="local" id="local">CORREDOR 3 · ESTANTE <span>09</span> · NÍVEL B</p>

  <section class="card" id="card">
    <h1 class="produto" id="produto">Glifosato 480 SL</h1>
    <p class="fabricante" id="fabricante">Herbicida · balde 20 L</p>

    <div class="leitura">
      <span class="numero" id="numero">90</span>
      <span class="unidade" id="unidade">baldes</span>
    </div>
    <p class="equivalencia" id="equivalencia">1.800 L em estoque</p>
    <p class="alerta" id="alerta">ABAIXO DO MÍNIMO</p>

    <div class="sync">
      <span class="dot"></span>
      <span id="sync">sincronizado há 4 min</span>
    </div>
  </section>

  <div class="demo" role="group" aria-label="Alternar produto da maquete">
    <button type="button" aria-pressed="true" data-i="0">BALDE 20 L</button>
    <button type="button" aria-pressed="false" data-i="1">CAIXA 5 L</button>
    <button type="button" aria-pressed="false" data-i="2">ESTOQUE BAIXO</button>
  </div>

  <p class="rodape">CAMDA · QUIRINÓPOLIS GO</p>
</main>

<script>
const itens = [
  {
    local:'CORREDOR 3 · ESTANTE <span>09</span> · NÍVEL B',
    produto:'Glifosato 480 SL',
    fabricante:'Herbicida · balde 20 L',
    numero:90, unidade:'baldes',
    equivalencia:'1.800 L em estoque',
    sync:'sincronizado há 4 min',
    baixo:false
  },
  {
    local:'CORREDOR 1 · ESTANTE <span>04</span> · NÍVEL A',
    produto:'Azoxistrobina 250 SC',
    fabricante:'Fungicida · caixa 4 × 5 L',
    numero:68, unidade:'caixas',
    equivalencia:'272 unidades · 1.360 L',
    sync:'sincronizado há 11 min',
    baixo:false
  },
  {
    local:'CORREDOR 3 · ESTANTE <span>12</span> · NÍVEL C',
    produto:'Atrazina 500 SC',
    fabricante:'Herbicida · balde 20 L',
    numero:6, unidade:'baldes',
    equivalencia:'120 L em estoque',
    sync:'sincronizado há 2 min',
    baixo:true
  }
];

const el = id => document.getElementById(id);
const semMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function contar(destino){
  if(semMotion){ el('numero').textContent = destino; return; }
  const inicio = performance.now(), dur = 420;
  function passo(t){
    const p = Math.min((t - inicio) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el('numero').textContent = Math.round(destino * eased);
    if(p < 1) requestAnimationFrame(passo);
  }
  requestAnimationFrame(passo);
}

function render(i){
  const it = itens[i];
  el('local').innerHTML = it.local;
  el('produto').textContent = it.produto;
  el('fabricante').textContent = it.fabricante;
  el('unidade').textContent = it.unidade;
  el('equivalencia').textContent = it.equivalencia;
  el('sync').textContent = it.sync;
  el('card').classList.toggle('baixo', it.baixo);
  contar(it.numero);
}

document.querySelectorAll('.demo button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.demo button')
      .forEach(o => o.setAttribute('aria-pressed', String(o === b)));
    render(Number(b.dataset.i));
  });
});

render(0);
</script>
</body>
</html>
